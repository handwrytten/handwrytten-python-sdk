[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "handwrytten"
version = "1.5.0"
description = "Official Python SDK for the Handwrytten API — send real handwritten notes at scale"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Handwrytten", email = "contact@handwrytten.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["requests>=2.25.0", "click>=8.0"]

[project.scripts]
handwrytten = "handwrytten.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.23",
    "mypy>=1.10",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://www.handwrytten.com"
Documentation = "https://www.handwrytten.com/api/"
Repository = "https://github.com/handwrytten/handwrytten-python-sdk"
Issues = "https://github.com/handwrytten/handwrytten-python-sdk/issues"

[tool.setuptools.packages.find]
include = ["handwrytten*"]

[tool.setuptools.package-data]
handwrytten = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pinned explicitly so new ruff releases do not change what CI enforces.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "PIE", "C4", "RUF022"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
